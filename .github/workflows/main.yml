# GitHub Actions workflow name
name: Smart Campus CI/CD

# Trigger conditions for the workflow
on:
  push:
    # Run workflow when code is pushed to these branches
    branches: [ main, master, develop ]
  pull_request:
    # Run workflow when PR is created targeting these branches
    branches: [ main, master ]

jobs:
  # Backend build job
  backend-build:
    # Use Ubuntu runner
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository code
      - uses: actions/checkout@v3

      # Step 2: Setup Java (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17' # Java version
          distribution: 'temurin' # Java distribution
          cache: maven # Enable Maven dependency caching

      # Step 3: Build backend using Maven
      - name: Build with Maven
        run: mvn -B package --file backend/pom.xml

      # Step 4: Run backend unit tests
      - name: Run Backend Tests
        run: mvn test --file backend/pom.xml

  # Frontend build job
  frontend-build:
    # Use Ubuntu runner
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository code
      - uses: actions/checkout@v3

      # Step 2: Setup Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Node.js version
          cache: 'npm' # Enable npm caching
          cache-dependency-path: frontend/package.json # Cache based on package.json

      # Step 3: Install frontend dependencies
      - name: Install dependencies
        run: |
          cd frontend
          npm install

      # Step 4: Build frontend project
      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      # Step 5: Run frontend tests
      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test -- --watchAll=false --passWithNoTests
